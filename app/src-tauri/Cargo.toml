[package]
name = "ascent-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Ascent Flasher (unofficial) desktop app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ascent-proto = { path = "../../crates/ascent-proto", features = ["serial", "logging", "sim"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-appender = "0.2"

